<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <checkbox
    id="zotero-prefpane-__addonRef__-enableAISuggestions"
    preference="enableAISuggestions"
    data-l10n-id="pref-enable-ai-suggestions"
  />

  <checkbox
    id="zotero-prefpane-__addonRef__-hotkeyEnabled"
    preference="hotkeyEnabled"
    data-l10n-id="pref-enable-hotkey"
  />
  <hbox align="center" style="gap: 6px; margin-inline-start: 20px">
    <html:label
      for="zotero-prefpane-__addonRef__-hotkey"
      data-l10n-id="pref-hotkey"
    ></html:label>
    <html:input
      id="zotero-prefpane-__addonRef__-hotkey"
      type="text"
      readonly="readonly"
      size="18"
      data-l10n-id="pref-hotkey-placeholder"
    ></html:input>
    <button
      id="zotero-prefpane-__addonRef__-hotkeySuggested"
      data-l10n-id="pref-hotkey-use-suggested"
    />
    <button
      id="zotero-prefpane-__addonRef__-hotkeyClear"
      data-l10n-id="pref-hotkey-clear"
    />
  </hbox>
  <html:div
    id="zotero-prefpane-__addonRef__-hotkeyStatus"
    style="font-size: 0.9em; color: #666; margin-inline-start: 20px"
  ></html:div>

  <label><html:h3 data-l10n-id="pref-api-settings"></html:h3></label>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-apiProvider"
      data-l10n-id="pref-api-provider"
    ></html:label>
    <menulist
      id="zotero-prefpane-__addonRef__-apiProvider"
      preference="apiProvider"
    >
      <menupopup>
        <menuitem label="OpenAI" value="openai" />
        <menuitem label="Anthropic (Claude)" value="anthropic" />
        <menuitem label="Google (Gemini)" value="google" />
        <menuitem label="DeepSeek" value="deepseek" />
      </menupopup>
    </menulist>
  </hbox>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-apiModel"
      data-l10n-id="pref-api-model"
    ></html:label>
    <menulist id="zotero-prefpane-__addonRef__-apiModel" preference="apiModel">
      <menupopup>
        <menuitem label="GPT-5.6 Luna (OpenAI)" value="gpt-5.6-luna" />
        <menuitem label="GPT-4o Mini (OpenAI)" value="gpt-4o-mini" />
        <menuitem
          label="Claude Haiku 4.5 (Anthropic)"
          value="claude-haiku-4-5-20251001"
        />
        <menuitem
          label="Gemini 3.5 Flash-Lite (Google)"
          value="gemini-3.5-flash-lite"
        />
        <menuitem
          label="Gemini 3.1 Flash-Lite (Google)"
          value="gemini-3.1-flash-lite"
        />
        <menuitem
          label="DeepSeek-V4-Flash (DeepSeek)"
          value="deepseek-v4-flash"
        />
      </menupopup>
    </menulist>
  </hbox>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-apiKey"
      data-l10n-id="pref-api-key"
    ></html:label>
    <html:input
      type="password"
      id="zotero-prefpane-__addonRef__-apiKey"
      preference="apiKey"
      style="flex: 1"
    ></html:input>
  </hbox>

  <label><html:h3 data-l10n-id="pref-prompt-settings"></html:h3></label>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-maxTags"
      data-l10n-id="pref-max-tags"
    ></html:label>
    <html:input
      type="number"
      id="zotero-prefpane-__addonRef__-maxTags"
      preference="maxTags"
      min="1"
      max="20"
      style="width: 60px"
    ></html:input>
  </hbox>

  <vbox>
    <html:label
      for="zotero-prefpane-__addonRef__-customPrompt"
      data-l10n-id="pref-custom-prompt"
    ></html:label>
    <html:textarea
      id="zotero-prefpane-__addonRef__-customPrompt"
      preference="customPrompt"
      rows="8"
      style="width: 100%"
    ></html:textarea>
    <html:div style="font-size: 0.9em; color: #666; margin-top: 4px">
      <html:span data-l10n-id="pref-prompt-help"></html:span>
    </html:div>
  </vbox>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
